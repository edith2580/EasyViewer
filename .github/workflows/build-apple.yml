name: Build Apple (macOS / iOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run mac:build
      - uses: actions/upload-artifact@v4
        with:
          name: EasyViewer-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/**

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: npm ci
      - run: npm run ios:init
      # Unsigned simulator-less build check. For App Store / device builds set
      # APPLE_DEVELOPMENT_TEAM and signing secrets, then run `npm run ios:build`.
      - run: npm run ios:build -- --debug --target aarch64-sim
        continue-on-error: true

