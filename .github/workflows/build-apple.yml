# macOS universal build (manual / PR). iOS is built and uploaded locally via Xcode
# (TestFlight / App Store); an unsigned simulator build in CI produced nothing usable.
name: Build macOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run verify
      # Signs + notarizes when the Apple secrets are available (falls back to an
      # ad-hoc build with a warning otherwise, e.g. for fork PRs).
      - name: Build, sign and notarize macOS bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/ci/macos-build-signed.sh
      # Upload the DMG and a ditto-zipped .app (a raw .app folder loses its
      # executable bits/symlinks inside the artifact zip and won't launch).
      - uses: actions/upload-artifact@v4
        with:
          name: EasyViewer-macOS-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
          if-no-files-found: error

