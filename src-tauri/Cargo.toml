[package]
name = "easy-viewer"
version = "0.2.6"
description = "심플한 Text, EPUB 범용 문서 뷰어"
authors = ["EasyViewer Team"]
edition = "2021"

[lib]
name = "easy_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-keyring-store = "0.3.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
# Pinned-certificate verifier for user-approved self-signed NAS certificates (all platforms).
rustls = { version = "0.23", default-features = false }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

